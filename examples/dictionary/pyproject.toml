[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deeptutor-dictionary-plugin"
version = "1.0.0"
description = "Offline dictionary lookup extension for DeepTutor Immersive Reading"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."deeptutor.reading_extensions"]
dictionary = "dictionary_plugin:DictionaryExtension"

[tool.setuptools.packages.find]
where = ["src"]
