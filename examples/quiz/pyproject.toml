[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deeptutor-simple-quiz-plugin"
version = "1.0.0"
description = "Offline cloze quiz extension for DeepTutor Immersive Reading"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."deeptutor.reading_extensions"]
simple_quiz = "simple_quiz_plugin:SimpleQuizExtension"

[tool.setuptools.packages.find]
where = ["src"]
